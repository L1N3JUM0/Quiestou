<script>
/* ---------------------------------------------------------
   DONNÉES / NORMALISATION
--------------------------------------------------------- */
const DAYS = ['lundi','mardi','mercredi','jeudi','vendredi'];
const DAY_LABEL = {lundi:'Lundi',mardi:'Mardi',mercredi:'Mercredi',jeudi:'Jeudi',vendredi:'Vendredi'};
const JS_DAY_TO_KEY = {1:'lundi',2:'mardi',3:'mercredi',4:'jeudi',5:'vendredi'};

const CANON_MAP = {
  'roseline':'Rose-Line','rose line':'Rose-Line',
  'brad':'Brad','melvin':'Melvin','clara':'Clara','linda':'Linda','aimad':'Aimad',
  'jullien':'Jullien','thomas':'Thomas','milouda':'Milouda'
};
function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function normKey(s){ return stripAccents((s||'').toString().trim().toLowerCase()).replace(/[-\s]+/g,' ').trim(); }
function canonName(raw){
  const k = normKey(raw);
  if (CANON_MAP[k]) return CANON_MAP[k];
  const s = (raw||'').toString().trim();
  return s;
}

function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function fromMin(min){
  min = Math.round(min);
  let h = Math.floor(min/60)%24, m = min%60;
  if(h<0) h+=24;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmtSerial(v){
  // v: excel fractional day serial, or full datetime serial
  const frac = v - Math.floor(v);
  return fromMin(Math.round(frac*1440));
}

function parseCellA(v){
  if(v===null || v===undefined || v==='') return {type:'empty'};
  if(typeof v === 'number'){
    return {type:'point', time: fmtSerial(v)};
  }
  const s = v.toString().trim();
  if(!s) return {type:'empty'};
  const low = stripAccents(s.toLowerCase());
  // Récré (H:MM - H:MM)
  let m = s.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if(low.includes('recre') && m){
    return {type:'range', start:pad(m[1],m[2]), end:pad(m[3],m[4]), label:'Récré'};
  }
  m = s.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
  if(m) return {type:'range', start:pad(m[1],m[2]), end:pad(m[3],m[4]), label:s};
  m = s.match(/^(\d{1,2}):(\d{2})\/(\d{1,2}):(\d{2})$/);
  if(m) return {type:'range', start:pad(m[1],m[2]), end:pad(m[3],m[4]), label:s};
  return {type:'label', text:s};
}
function pad(h,m){ return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }

function resolveSlots(rawRows){
  // Point-time rows (a bare clock time in column A, e.g. 8:55, 11:00, 14:25,
  // 16:30) represent a short "intercours" surveillance window: they get a
  // 4-minute slot (2 min before/after the anchor) using their own poste
  // content. Label rows (M1, M2, S1...) span from the previous anchor to
  // the next one, shrinking by 2 min on the side that touches a point-row.
  const INTERCOURS_PAD = 2; // minutes before/after the anchor time
  const slots = [];
  let lastEnd = null;
  for(let i=0;i<rawRows.length;i++){
    const rr = rawRows[i], p = rr.parsed;
    if(p.type==='range'){
      slots.push({label:p.label, start:p.start, end:p.end, cells:rr.cells});
      lastEnd = p.end;
    } else if(p.type==='point'){
      const preEnd = fromMin(toMin(p.time)-INTERCOURS_PAD);
      const postStart = fromMin(toMin(p.time)+INTERCOURS_PAD);
      if(Object.keys(rr.cells).length>0){
        slots.push({label:'Intercours', start:preEnd, end:postStart, cells:rr.cells});
      }
      lastEnd = postStart;
    } else {
      const start = lastEnd;
      let end = null;
      for(let j=i+1;j<rawRows.length;j++){
        const pj = rawRows[j].parsed;
        if(pj.type==='point'){ end = fromMin(toMin(pj.time)-INTERCOURS_PAD); break; }
        if(pj.type==='range'){ end = pj.start; break; }
      }
      if(end===null) end = start;
      slots.push({label:p.type==='label'?p.text:'', start, end, cells:rr.cells});
      lastEnd = end;
    }
  }
  return slots.filter(s=> s.start!==s.end);
}

function applyForwardFill(slots, arrivals, departures, aedNames){
  // A blank cell means "same poste as before", not "nothing planned" —
  // carry the last known value forward until a new value appears,
  // bounded by that AED's arrival/departure for the day.
  const last = {};
  slots.forEach(slot=>{
    aedNames.forEach(aed=>{
      if(slot.cells[aed]){
        last[aed] = slot.cells[aed];
      } else if(last[aed]!==undefined){
        const dep = departures[aed], arr = arrivals[aed];
        if((!dep || slot.start<dep) && (!arr || slot.end>arr)){
          slot.cells[aed] = last[aed];
        }
      }
    });
  });
}

function parseDaySheet(ws){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  if(!rows || rows.length<5) return null;
  const headerRow = rows[3] || [];
  const aedCols = [];
  for(let c=1;c<headerRow.length;c++){
    const v = headerRow[c];
    if(v!=null && typeof v==='string' && v.trim()!==''){
      const k = normKey(v);
      if(k==='cr') continue;
      aedCols.push({colIdx:c, name:canonName(v)});
    }
  }
  const arrivals = {};
  let embaucheIdx = rows.findIndex(r=> r && r[0] && normKey(r[0]).startsWith('embauche'));
  if(embaucheIdx===-1) embaucheIdx = 4;
  let finIdx = rows.findIndex((r,i)=> i>embaucheIdx && r && r[0] && normKey(r[0]).startsWith('fin'));
  if(finIdx===-1){
    let dureeIdx = rows.findIndex(r=> r && r[0] && normKey(r[0]).startsWith('dur'));
    finIdx = dureeIdx>embaucheIdx ? dureeIdx-1 : rows.length;
  }
  const arrRow = rows[embaucheIdx] || [];
  aedCols.forEach(a=>{
    const v = arrRow[a.colIdx];
    if(typeof v==='number') arrivals[a.name] = fmtSerial(v);
  });

  const departures = {};
  const depRow = rows[finIdx] || [];
  aedCols.forEach(a=>{
    const v = depRow[a.colIdx];
    if(typeof v==='number') departures[a.name] = fmtSerial(v);
  });

  const rawRows = [];
  for(let r=embaucheIdx+1;r<finIdx;r++){
    const row = rows[r]; if(!row) continue;
    const parsed = parseCellA(row[0]);
    const cells = {};
    aedCols.forEach(a=>{
      const v = row[a.colIdx];
      if(v!=null && v!=='' && typeof v!=='number'){
        cells[a.name] = v.toString().trim();
      }
    });
    if(parsed.type==='empty' && Object.keys(cells).length===0) continue;
    rawRows.push({parsed, cells});
  }
  const slots = resolveSlots(rawRows);
  applyForwardFill(slots, arrivals, departures, aedCols.map(a=>a.name));
  return {
    aedNames: aedCols.map(a=>a.name),
    arrivals, departures, slots
  };
}

function parseWorkbook(wb){
  const data = {};
  const aedSet = new Set();
  DAYS.forEach(day=>{
    const sheetName = wb.SheetNames.find(n=> normKey(n)===day);
    if(!sheetName) return;
    const parsed = parseDaySheet(wb.Sheets[sheetName]);
    if(parsed){
      data[day] = parsed;
      parsed.aedNames.forEach(n=>aedSet.add(n));
    }
  });
  return { days:data, aedList: Array.from(aedSet).sort((a,b)=>a.localeCompare(b,'fr')), importedAt: new Date().toISOString() };
}

/* ---------------------------------------------------------
   DONNÉES INTÉGRÉES (planning EDT VS 2026/2027)
   -> pas besoin d'importer un fichier pour utiliser l'appli.
   -> un import ultérieur (bouton "Mettre à jour le planning")
      écrase ces données par défaut pour toute l'équipe.
--------------------------------------------------------- */
const EMBEDDED_SCHEDULE = {"days":{"lundi":{"aedNames":["Rose-Line","Brad","Melvin","Clara","Linda","Aimad","Jullien","Thomas","Milouda"],"arrivals":{"Rose-Line":"08:50","Brad":"07:25","Melvin":"07:30","Clara":"07:30","Aimad":"07:25","Jullien":"08:30","Thomas":"07:40","Milouda":"07:40"},"departures":{"Rose-Line":"17:40","Brad":"17:40","Melvin":"17:30","Clara":"17:00","Aimad":"17:40","Jullien":"16:40","Thomas":"17:30","Milouda":"16:40"},"slots":[{"label":"7:25 - 7:40","start":"07:25","end":"07:40","cells":{"Brad":"Hall","Melvin":"portail","Clara":"portail renfort z3","Aimad":"bureau 1","Thomas":"cour Zone 3"}},{"label":"7:40 - 8:00","start":"07:40","end":"08:00","cells":{"Brad":"Accueil perm","Melvin":"portail","Clara":"portail renfort z3","Aimad":"Hall/bureau","Thomas":"cour Zone 3","Milouda":"cour Zone 2"}},{"label":"M1","start":"08:00","end":"08:53","cells":{"Rose-Line":"retards couloirs","Brad":"Etudes/retenue","Melvin":"appel des familles","Clara":"retards couloirs","Aimad":"bureau 1","Jullien":"Hall/bureau","Thomas":"Etudes/retenue","Milouda":"Etudes/retenue"}},{"label":"Intercours","start":"08:53","end":"08:57","cells":{"Rose-Line":"couloirs RDC/Arts","Brad":"couloirs 2°","Melvin":"portail","Clara":"Accueil perm","Aimad":"Hall/bureau","Jullien":"hall/cour","Thomas":"couloirs 1er","Milouda":"couloirs 2°"}},{"label":"M2","start":"08:57","end":"09:50","cells":{"Rose-Line":"Etudes/retenue","Brad":"retards couloirs","Melvin":"appel des familles","Clara":"appel des familles","Aimad":"bureau 1","Jullien":"ULIS","Thomas":"Etudes/retenue","Milouda":"bureau retenues"}},{"label":"Récré","start":"09:50","end":"10:05","cells":{"Rose-Line":"cour Zone 1 Arts","Brad":"cour Zone 2","Melvin":"portail","Clara":"Hall","Aimad":"bureau 2 puis zone 1","Jullien":"hall/cour","Thomas":"cour Zone 3","Milouda":"cour zone 1T"}},{"label":"M3","start":"10:05","end":"10:58","cells":{"Rose-Line":"Etudes/retenue","Brad":"Etudes/retenue","Melvin":"suivi classe abs","Clara":"Etudes/retenue","Aim const STORAGE_KEY = 'edt-planning-v1';
async function loadSchedule(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res) return JSON.parse(res.value);
  }catch(e){ /* pas encore de version importée par l'équipe */ }
  return EMBEDDED_SCHEDULE;
}
async function saveSchedule(obj){
  await window.storage.set(STORAGE_KEY, JSON.stringify(obj), true);
}

let SCHEDULE = null;
let TAB = 'direct';
let selectedAeds = [];
let selectedDayView = 'today';
let searchTime = '';
let searchDay = '';

function todayKey(offset=0){
  const d = new Date();
  d.setDate(d.getDate()+offset);
  return JS_DAY_TO_KEY[d.getDay()] || null;
}
function nowStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function getAedSlots(day, aed){
  // Returns this AED's slots for the day: clipped to their actual working
  // hours (arrival/departure) and merged when consecutive slots share the
  // same poste, for a clean continuous-block display.
  const d = SCHEDULE.days[day];
  if(!d) return [];
  const arr = d.arrivals[aed], dep = d.departures[aed];
  let list = d.slots
    .filter(s=> s.cells[aed])
    .map(s=>({start:s.start, end:s.end, label:s.label, poste:s.cells[aed]}));
  list = list.map(s=>{
    let start = s.start, end = s.end;
    if(arr && start<arr) start = arr;
    if(dep && end>dep) end = dep;
    return {...s, start, end};
  }).filter(s=> s.start<s.end);
  const merged = [];
  list.forEach(s=>{
    const last = merged[merged.length-1];
    if(last && last.end===s.start && last.poste===s.poste){
      last.end = s.end;
      if(last.label!==s.label) last.label = '';
    } else {
      merged.push({...s});
    }
  });
  return merged;
}
function findSlot(day, aed, time){
  return getAedSlots(day, aed).find(s=> time>=s.start && time<s.end) || null;
}
function findNextSlot(day, aed, time){
  const future = getAedSlots(day, aed).filter(s=> s.start>time);
  return future[0] || null;
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

async function init(){
  SCHEDULE = await loadSchedule();
  render();
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(el(`
    <header>
      <h1>👀 Qui est où ?</h1>
      <div class="sub">${SCHEDULE ? 'Planning AED — '+(SCHEDULE.aedList.length)+' AED chargés' : 'Aucun planning chargé'}</div>
    </header>
  `));

  const tabDefs = [
    ['direct','🔴','En direct'],
    ['next','⏭️','Prochain'],
    ['time','🕒','Horaire'],
    ['aed','🧑','AED'],
    ['week','📅','Planning']
  ];
  const nav = el(`<div class="bottomnav"></div>`);
  tabDefs.forEach(([key,icon,label])=>{
    const b = el(`<button class="navbtn ${TAB===key?'active':''}"><span class="ic">${icon}</span><span class="lb">${label}</span></button>`);
    b.onclick = ()=>{ TAB=key; render(); };
    nav.appendChild(b);
  });

  const content = el(`<div class="content"></div>`);
  app.appendChild(content);

  if(TAB==='direct') content.appendChild(renderDirect());
  if(TAB==='next') content.appendChild(renderNext());
  if(TAB==='time') content.appendChild(renderTimeSearch());
  if(TAB==='aed') content.appendChild(renderAedSearch());
  if(TAB==='week') content.appendChild(renderWeek());

  content.appendChild(renderReimport());
  app.appendChild(nav);
}

function renderImport(){
  const wrap = el(`
    <div class="card import-zone">
      <div style="font-size:30px;">📊</div>
      <h2>Mettre à jour le planning</h2>
      <p>À utiliser seulement si le planning a changé (nouveau trimestre, nouvelle année…). Sélectionne le fichier Excel EDT VS (onglets lundi → vendredi) : la mise à jour sera partagée avec toute l'équipe.</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
      <button class="btn secondary" id="importBtn">Choisir un fichier .xlsx</button>
      <div id="importMsg" class="small" style="margin-top:10px;"></div>
    </div>
  `);
  const input = wrap.querySelector('#fileInput');
  const msg = wrap.querySelector('#importMsg');
  wrap.querySelector('#importBtn').onclick = ()=> input.click();
  input.onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    msg.textContent = 'Lecture du fichier…';
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array', cellDates:false});
      const parsed = parseWorkbook(wb);
      if(Object.keys(parsed.days).length===0){
        msg.textContent = "Aucun onglet lundi/mardi/mercredi/jeudi/vendredi trouvé dans ce fichier.";
        return;
      }
      await saveSchedule(parsed);
      SCHEDULE = parsed;
      showUpdatePanel = false;
      render();
    }catch(err){
      msg.textContent = 'Erreur de lecture : '+err.message;
    }
  };
  return wrap;
}

let showUpdatePanel = false;
function renderReimport(){
  const wrap = el(`<div></div>`);
  const bar = el(`
    <div class="card">
      <div class="row">
        <div class="small">Planning à jour au ${SCHEDULE.importedAt ? new Date(SCHEDULE.importedAt).toLocaleDateString('fr-FR') : '?'}</div>
        <button class="btn ghost" id="toggleUpdate">${showUpdatePanel ? 'Fermer' : 'Mettre à jour'}</button>
      </div>
    </div>
  `);
  bar.querySelector('#toggleUpdate').onclick = ()=>{ showUpdatePanel = !showUpdatePanel; render(); };
  wrap.appendChild(bar);
  if(showUpdatePanel) wrap.appendChild(renderImport());
  return wrap;
}

function aedBadge(aed, day, time, showNext){
  const slot = findSlot(day, aed, time);
  let posteText, isOff=false;
  if(slot){ posteText = slot.poste; }
  else{
    const d = SCHEDULE.days[day];
    const arr = d && d.arrivals[aed], dep = d && d.departures[aed];
    if(arr && time<arr){ posteText='Pas encore arrivé(e)'; isOff=true; }
    else if(dep && time>=dep){ posteText='Service terminé'; isOff=true; }
    else{ posteText='Pause / non renseigné'; isOff=true; }
  }
  let nextInfo = '';
  if(showNext){
    const nxt = findNextSlot(day, aed, time);
    if(nxt) nextInfo = `<div class="time-label">Puis ${nxt.start} → ${nxt.poste}</div>`;
  }
  return `
    <div class="poste-row">
      <div>
        <div class="aed-name">${aed}</div>
        ${slot? `<div class="time-label">${slot.start} – ${slot.end}${slot.label?' · '+slot.label:''}</div>`:''}
        ${nextInfo}
      </div>
      <div class="poste-badge ${isOff?'off':''}">${posteText}</div>
    </div>
  `;
}

function renderDirect(){
  const day = todayKey(0);
  const wrap = el(`<div></div>`);
  if(!day){
    wrap.appendChild(el(`<div class="card empty-state">🏫 Pas d'école aujourd'hui (week-end).</div>`));
    return wrap;
  }
  const time = nowStr();
  const card = el(`<div class="card"><h2>🔴 En direct — ${DAY_LABEL[day]} ${time}</h2><div id="list"></div></div>`);
  const list = card.querySelector('#list');
  SCHEDULE.aedList.forEach(aed=>{
    list.appendChild(el(aedBadge(aed, day, time, false)));
  });
  wrap.appendChild(card);
  return wrap;
}

function renderNext(){
  const day = todayKey(0);
  const wrap = el(`<div></div>`);
  if(!day){
    wrap.appendChild(el(`<div class="card empty-state">🏫 Pas d'école aujourd'hui (week-end).</div>`));
    return wrap;
  }
  const time = nowStr();
  const card = el(`<div class="card"><h2>⏭️ Prochain créneau — ${DAY_LABEL[day]}</h2><div id="list"></div></div>`);
  const list = card.querySelector('#list');
  SCHEDULE.aedList.forEach(aed=>{
    const nxt = findNextSlot(day, aed, time);
    list.appendChild(el(`
      <div class="poste-row">
        <div>
          <div class="aed-name">${aed}</div>
          ${nxt? `<div class="time-label">à partir de ${nxt.start}${nxt.label?' · '+nxt.label:''}</div>`:'<div class="time-label">Rien de prévu ensuite</div>'}
        </div>
        <div class="poste-badge ${nxt?'':'off'}">${nxt? nxt.poste : '—'}</div>
      </div>
    `));
  });
  wrap.appendChild(card);
  return wrap;
}

function renderTimeSearch(){
  if(!searchDay) searchDay = todayKey(0) || 'lundi';
  if(!searchTime) searchTime = nowStr();
  const wrap = el(`
    <div class="card">
      <h2>🕒 Recherche par créneau horaire</h2>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Jour</label>
          <select id="daySel"></select>
        </div>
        <div class="field">
          <label class="field-label">Heure</label>
          <input type="time" id="timeSel" value="${searchTime}">
        </div>
      </div>
      <div id="list" style="margin-top:14px;"></div>
    </div>
  `);
  const daySel = wrap.querySelector('#daySel');
  DAYS.forEach(d=> daySel.appendChild(el(`<option value="${d}" ${d===searchDay?'selected':''}>${DAY_LABEL[d]}</option>`)));
  daySel.onchange = ()=>{ searchDay=daySel.value; render(); };
  wrap.querySelector('#timeSel').onchange = (e)=>{ searchTime=e.target.value; render(); };

  const list = wrap.querySelector('#list');
  if(!SCHEDULE.days[searchDay]){
    list.appendChild(el(`<div class="empty-state">Aucune donnée pour ce jour.</div>`));
  } else {
    SCHEDULE.aedList.forEach(aed=>{
      list.appendChild(el(aedBadge(aed, searchDay, searchTime, false)));
    });
  }
  return wrap;
}

function renderAedSearch(){
  const wrap = el(`
    <div class="card">
      <div class="row">
        <h2 style="margin:0;">🧑 Recherche par AED</h2>
        <span class="small">${selectedAeds.length} sélectionné${selectedAeds.length>1?'s':''}</span>
      </div>
      <div class="chips" id="chips"></div>
      <div class="action-row">
        <button class="btn secondary" id="selAll">Tout sélectionner</button>
        <button class="btn secondary" id="selNone">Effacer</button>
      </div>
    </div>
  `);
  wrap.querySelector('#selAll').onclick = ()=>{ selectedAeds = [...SCHEDULE.aedList]; render(); };
  wrap.querySelector('#selNone').onclick = ()=>{ selectedAeds = []; render(); };
  const chips = wrap.querySelector('#chips');
  SCHEDULE.aedList.forEach(aed=>{
    const active = selectedAeds.includes(aed);
    const c = el(`<button class="chip ${active?'active':''}">${aed}</button>`);
    c.onclick = ()=>{
      if(selectedAeds.includes(aed)) selectedAeds = selectedAeds.filter(a=>a!==aed);
      else selectedAeds.push(aed);
      render();
    };
    chips.appendChild(c);
  });

  const day = todayKey(0);
  const resultsCard = el(`<div class="card"><h2>Résultat — ${day?DAY_LABEL[day]+' '+nowStr():'week-end'}</h2><div id="res"></div></div>`);
  const res = resultsCard.querySelector('#res');
  if(selectedAeds.length===0){
    res.appendChild(el(`<div class="empty-state">Sélectionne un ou plusieurs AED ci-dessus.</div>`));
  } else if(!day){
    res.appendChild(el(`<div class="empty-state">Pas d'école aujourd'hui.</div>`));
  } else {
    selectedAeds.forEach(aed=> res.appendChild(el(aedBadge(aed, day, nowStr(), true))));
  }
  const container = el(`<div></div>`);
  container.appendChild(wrap);
  container.appendChild(resultsCard);
  return container;
}

  aedSel.onchange = ()=>{ selectedAeds[0]=aedSel.value; render(); };
  selCard.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{ selectedDayView=c.dataset.v; render(); };
  });
  wrap.appendChild(selCard);

  const aed = selectedAeds[0];
  let daysToShow = [];
  if(selectedDayView==='today') daysToShow = [todayKey(0)].filter(Boolean);
  else if(selectedDayView==='tomorrow') daysToShow = [todayKey(1)].filter(Boolean);
  else daysToShow = DAYS;

  if(daysToShow.length===0){
    wrap.appendChild(el(`<div class="card empty-state">Pas d'école ce jour-là (week-end).</div>`));
    return wrap;
  }

  daysToShow.forEach(day=>{
    const d = SCHEDULE.days[day];
    const card = el(`<div class="card"><h2>${DAY_LABEL[day]}</h2></div>`);
    if(!d){ card.appendChild(el(`<div class="empty-state">Pas de donnée.</div>`)); wrap.appendChild(card); return; }
    const arr = d.arrivals[aed], dep = d.departures[aed];
    if(arr || dep){
      card.appendChild(el(`<div class="small" style="margin-bottom:8px;">${arr?'Arrivée '+arr:''}${arr&&dep?' · ':''}${dep?'Départ '+dep:''}</div>`));
    }
    const slots = getAedSlots(day, aed);
    if(slots.length===0){
      card.appendChild(el(`<div class="empty-state">Aucun poste ce jour pour ${aed}.</div>`));
    } else {
      slots.forEach(s=>{
        card.appendChild(el(`
          <div class="slot-block">
            <span class="slot-time">${s.start} – ${s.end}</span>${s.label?`<span class="slot-label">${s.label}</span>`:''}
            <div class="slot-poste">${s.poste}</div>
          </div>
        `));
      });
    }
    wrap.appendChild(card);
  });
  return wrap;
}

init();
</script>
</body>
</html>
